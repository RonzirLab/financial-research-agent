name: SEC Filing Download

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker symbol to download, for example AMD
        required: true
        default: AMD
        type: string
      form:
        description: SEC form to download
        required: true
        default: 10-K
        type: choice
        options:
          - 10-K
          - 10-Q
          - 8-K
      latest:
        description: Number of newest matching filings to download
        required: true
        default: '1'
        type: string
      parse:
        description: Parse downloaded 10-K or 10-Q filings into section outputs (always enabled when analyze is selected for 10-K)
        required: true
        default: false
        type: boolean
      analyze:
        description: Run an AMD 10-K analyzer smoke test after parsing; OpenAI is used when its secret is configured, otherwise mock is selected explicitly
        required: true
        default: false
        type: boolean

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}
      SEC_USER_AGENT_NAME: ${{ secrets.SEC_USER_AGENT_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download SEC filing
        run: |
          uv run python -m financial_research_agent.sec download \
            --ticker "${{ inputs.ticker }}" \
            --form "${{ inputs.form }}" \
            --latest "${{ inputs.latest }}" \
            --output data/sec

      - name: Parse downloaded filing sections
        if: ${{ (inputs.parse || (inputs.analyze && inputs.form == '10-K')) && inputs.form != '8-K' }}
        run: |
          find data/sec -type f \( -name '*.htm' -o -name '*.html' \) -exec \
            uv run python -m financial_research_agent.sec parse --form "${{ inputs.form }}" --filing {} \;

      - name: Smoke-test parsed 10-K sections with the selected LLM provider
        if: ${{ inputs.analyze && inputs.form == '10-K' }}
        run: |
          set -euo pipefail
          if [ -n "$OPENAI_API_KEY" ]; then
            export LLM_PROVIDER=openai
          else
            export LLM_PROVIDER=mock
          fi

          echo "Selected LLM provider: $LLM_PROVIDER"
          if [ "$LLM_PROVIDER" = "openai" ]; then
            echo "Selected LLM model: ${OPENAI_MODEL:-gpt-4o-mini}"
          else
            echo "Selected LLM model: mock-v1"
          fi

          find data/sec -type f -name sections.json -exec sh -c '\
            for sections_file; do \
              uv run python -m financial_research_agent.sec analyze \
                --sections "$sections_file" \
                --output-dir "$(dirname "$sections_file")"; \
            done' sh {} +

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for analysis_path in sorted(Path("data/sec").rglob("analysis.json")):
              usage = json.loads(analysis_path.read_text(encoding="utf-8")).get("usage", {})
              print(f"Analysis artifact: {analysis_path}")
              print(f"Provider: {os.environ['LLM_PROVIDER']}")
              print(f"Model: {usage.get('model', 'unavailable')}")
              print(f"Input tokens: {usage.get('input_tokens', 'unavailable')}")
              print(f"Output tokens: {usage.get('output_tokens', 'unavailable')}")
              print(f"Total tokens: {usage.get('total_tokens', 'unavailable')}")
          PY

      - name: Upload downloaded filing
        uses: actions/upload-artifact@v4
        with:
          name: sec-filing-${{ inputs.ticker }}-${{ inputs.form }}
          path: data/sec/**
          if-no-files-found: error
